# GraphQL Schema: Connection 相关类型定义

# =============================================================================
# ENUMS
# =============================================================================

"""
连接加载状态
"""
enum ConnectionLoadStatus {
	"""
	已加载
	"""
	LOADED
	"""
	加载中
	"""
	LOADING
	"""
	加载失败
	"""
	ERROR
}

# =============================================================================
# TYPES
# =============================================================================

"""
远程存储连接
"""
type Connection {
	"""
	UUID 主键
	"""
	id: ID!
	"""
	连接名称（系统唯一）
	"""
	name: String!
	"""
	提供者类型（如 onedrive, s3, drive）
	"""
	type: String!
	"""
	配置参数（解密后，需要解密处理）
	"""
	config: StringMap! @goField(forceResolver: true)
	"""
	加载状态（运行时状态）
	"""
	loadStatus: ConnectionLoadStatus! @goField(forceResolver: true)
	"""
	加载错误信息（运行时状态，仅当 loadStatus 为 ERROR 时有值）
	"""
	loadError: String @goField(forceResolver: true)
	"""
	创建时间
	"""
	createdAt: DateTime!
	"""
	更新时间
	"""
	updatedAt: DateTime!
	"""
	使用此连接的任务（分页查询）
	"""
	tasks(pagination: PaginationInput): TaskConnection! @goField(forceResolver: true)
	"""
	配额信息（调用 rclone about API）
	"""
	quota: ConnectionQuota @goField(forceResolver: true)
	"""
	连接扩展选项（包含缓存配置）
	"""
	options: ConnectionOptions
	"""
	缓存运行时状态（仅当 options.cache.enabled 为 true 时有值）
	这是一个计算字段，不持久化
	"""
	cacheStatus: ConnectionCacheStatus @goField(forceResolver: true)
}

"""
连接配额信息
"""
type ConnectionQuota {
	"""
	总空间（字节），可能为 null 如果存储不支持
	"""
	total: BigInt
	"""
	已使用空间（字节），可能为 null 如果存储不支持
	"""
	used: BigInt
	"""
	可用空间（字节），可能为 null 如果存储不支持
	"""
	free: BigInt
	"""
	回收站占用空间（字节），可能为 null 如果存储不支持
	"""
	trashed: BigInt
	"""
	其他空间占用（字节），如版本控制、元数据等，可能为 null
	"""
	other: BigInt
	"""
	对象/文件数量，可能为 null 如果存储不支持
	"""
	objects: BigInt
}

"""
连接扩展选项
"""
type ConnectionOptions {
	"""
	元数据缓存配置
	"""
	cache: ConnectionCacheOptions
}

"""
元数据缓存配置（持久化配置）
"""
type ConnectionCacheOptions {
	"""
	是否启用元数据缓存
	"""
	enabled: Boolean!
	"""
	缓存过期时间（Go duration 格式，如 "6h", "24h"）
	空值表示使用默认值（6小时）
	"0" 或负值表示永不过期（不推荐）
	"""
	infoAge: String
	"""
	ChangeNotify 轮询间隔（Go duration 格式，如 "1m", "5m"）
	空值表示使用默认值（1分钟）
	最小值为 10s
	"""
	changeNotifyPoll: String
}

"""
元数据缓存运行时状态（计算字段）
"""
type ConnectionCacheStatus {
	"""
	连接 ID
	"""
	connectionId: ID!
	"""
	缓存是否正在运行（Fs 已 Pin 且 ChangeNotify 已订阅）
	"""
	running: Boolean!
	"""
	ChangeNotify 是否可用（后端是否支持）
	"""
	changeNotifySupported: Boolean!
	"""
	缓存条目数量
	"""
	entriesCount: Int!
	"""
	缓存数据库文件大小（字节）
	"""
	dbSizeBytes: BigInt
	"""
	最后一次收到变更通知的时间（用于监控）
	"""
	lastNotifyTime: DateTime
}

"""
连接分页连接
"""
type ConnectionConnection {
	"""
	连接列表
	"""
	items: [Connection!]!
	"""
	总数
	"""
	totalCount: Int!
	"""
	分页信息
	"""
	pageInfo: OffsetPageInfo!
}

# =============================================================================
# INPUT TYPES
# =============================================================================

"""
创建连接输入
"""
input CreateConnectionInput {
	"""
	连接名称
	"""
	name: String!
	"""
	提供者类型
	"""
	type: String!
	"""
	配置参数
	"""
	config: StringMap!
	"""
	连接扩展选项（包含缓存配置）
	"""
	options: ConnectionOptionsInput
}

"""
更新连接输入
"""
input UpdateConnectionInput {
	"""
	连接名称
	"""
	name: String
	"""
	配置参数
	"""
	config: StringMap
	"""
	连接扩展选项（包含缓存配置）
	设置为 null 时保持不变
	"""
	options: ConnectionOptionsInput
}

"""
测试连接输入（未保存的配置）
"""
input TestConnectionInput {
	"""
	提供者类型
	"""
	type: String!
	"""
	配置参数
	"""
	config: StringMap!
}

"""
连接扩展选项输入
"""
input ConnectionOptionsInput {
	"""
	元数据缓存配置
	"""
	cache: ConnectionCacheOptionsInput
}

"""
元数据缓存配置输入
"""
input ConnectionCacheOptionsInput {
	"""
	是否启用元数据缓存
	"""
	enabled: Boolean!
	"""
	缓存过期时间（Go duration 格式，如 "6h", "24h"）
	空值或空字符串表示使用默认值（6小时）
	"""
	infoAge: String
	"""
	ChangeNotify 轮询间隔（Go duration 格式，如 "1m", "5m"）
	空值或空字符串表示使用默认值（1分钟）
	"""
	changeNotifyPoll: String
}

# =============================================================================
# RESULT TYPES
# =============================================================================

"""
连接测试成功
"""
type ConnectionTestSuccess {
	"""
	成功消息（已本地化）
	"""
	message: String!
}

"""
连接测试失败
"""
type ConnectionTestFailure {
	"""
	错误消息（已本地化）
	"""
	error: String!
}

"""
测试连接结果
"""
union TestConnectionResult = ConnectionTestSuccess | ConnectionTestFailure

"""
清理缓存结果
"""
type ClearCacheResult {
	"""
	是否成功
	"""
	success: Boolean!
	"""
	清理的条目数量
	"""
	clearedCount: Int!
	"""
	消息（已本地化）
	"""
	message: String!
}

# =============================================================================
# NAMESPACED TYPES
# =============================================================================

"""
连接查询命名空间
"""
type ConnectionQuery {
	"""
	获取连接列表
	"""
	list(pagination: PaginationInput): ConnectionConnection! @goField(forceResolver: true)
	"""
	获取单个连接
	"""
	get(id: ID!): Connection @goField(forceResolver: true)
}

"""
连接变更命名空间
"""
type ConnectionMutation {
	"""
	创建连接（失败抛出 GraphQL error）
	"""
	create(input: CreateConnectionInput!): Connection! @goField(forceResolver: true)
	"""
	更新连接（失败抛出 GraphQL error）
	"""
	update(id: ID!, input: UpdateConnectionInput!): Connection! @goField(forceResolver: true)
	"""
	删除连接（失败抛出 GraphQL error）
	"""
	delete(id: ID!): Connection! @goField(forceResolver: true)
	"""
	测试已保存的连接（测试失败是预期业务结果，用 union 表示）
	"""
	test(id: ID!): TestConnectionResult! @goField(forceResolver: true)
	"""
	测试未保存的连接配置（测试失败是预期业务结果，用 union 表示）
	"""
	testUnsaved(input: TestConnectionInput!): TestConnectionResult! @goField(forceResolver: true)
	"""
	清理指定连接的缓存数据
	- id: 连接 ID
	返回清理结果
	"""
	clearCache(id: ID!): ClearCacheResult! @goField(forceResolver: true)
}

# =============================================================================
# EXTEND ROOT TYPES
# =============================================================================

extend type Query {
	"""
	连接相关查询（命名空间）
	"""
	connection: ConnectionQuery! @goField(forceResolver: true)
}

extend type Mutation {
	"""
	连接相关变更（命名空间）
	"""
	connection: ConnectionMutation! @goField(forceResolver: true)
}

extend type Subscription {
	"""
	元数据缓存状态实时订阅
	- connectionId: 连接 ID
	返回该连接的实时缓存运行时状态
	"""
	cacheStatus(connectionId: ID!): ConnectionCacheStatus! @goField(forceResolver: true)
}
